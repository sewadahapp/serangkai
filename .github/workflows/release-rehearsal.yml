name: Release rehearsal

# Dry run for a release. Everything except publication: it computes the version,
# rewrites package.json and CHANGELOG.md in the runner, builds the image, and
# smoke-tests it. Nothing is pushed, tagged, published, or released.
#
# Use it to answer "what version would I get, and does the image actually boot?"
# before running the real Release workflow. Running the rehearsal first is
# cheaper than recovering a half-finished release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to rehearse
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: Exact version to rehearse (overrides the bump)
        required: false
        type: string
      platforms:
        description: Image architectures (AMD64-only fallback)
        type: choice
        default: linux/amd64,linux/arm64
        options: ["linux/amd64,linux/arm64", "linux/amd64"]

# Rehearsals only read the repository and push nothing, so they can be
# cancelled freely.
concurrency:
  group: release-rehearsal
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # Release work must happen against the real default-branch tip; a
      # rehearsal from a stale branch would rehearse the wrong commits.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-

      - uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Create the candidate changelog and version
        id: candidate
        env:
          REQUESTED: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A rehearsal may name any version, including one already released, so
          # only the requested version is validated here. The real workflow is
          # what enforces "must advance".
          if [[ -n "$REQUESTED" ]]; then
            node scripts/check-release-version.mjs "$REQUESTED" || {
              echo "::warning::The requested version would be rejected by the real release. Rehearsing it anyway."
            }
          fi

          args=(--release --no-github --no-commit --no-tag)
          if [[ -n "$REQUESTED" ]]; then
            args+=(-r "$REQUESTED")
          elif [[ "$BUMP" != "auto" ]]; then
            args+=("--$BUMP")
          fi

          bunx --no-install changelogen "${args[@]}"

          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### Rehearsed version: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          {
            echo ""
            echo "No image, tag, or GitHub release was published."
            echo ""
            echo '```markdown'
            head -40 CHANGELOG.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show what would be committed
        run: |
          set -euo pipefail
          echo "### Files the release would commit" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --short >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          git status --short

      # Compile the candidate once; package that same tested output twice.
      - name: Test and compile the candidate once
        timeout-minutes: 15
        run: |
          started=$SECONDS
          bun run test:ci
          echo "- Native candidate compilation + release tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the tested portable Docker output
        run: bun scripts/prepare-docker-output.mjs .output "$RUNNER_TEMP/docker-app"
      - name: Build the AMD64 image locally
        timeout-minutes: 10
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          build-contexts: app=${{ runner.temp }}/docker-app
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:rehearsal-amd64
          cache-from: type=gha,scope=serangkai-prebuilt-amd64
          cache-to: type=gha,scope=serangkai-prebuilt-amd64,mode=max
      - name: Build the ARM64 image locally
        if: contains(env.PLATFORMS, 'linux/arm64')
        timeout-minutes: 10
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          build-contexts: app=${{ runner.temp }}/docker-app
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:rehearsal-arm64
          cache-from: type=gha,scope=serangkai-prebuilt-arm64
          cache-to: type=gha,scope=serangkai-prebuilt-arm64,mode=max
      - uses: docker/setup-qemu-action@v3
        timeout-minutes: 3
        if: contains(env.PLATFORMS, 'linux/arm64')
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Smoke test the AMD64 image
        timeout-minutes: 4
        run: timeout 180 bash scripts/smoke-docker.sh "$IMAGE:rehearsal-amd64" linux/amd64
      - name: Smoke test the ARM64 image
        if: contains(env.PLATFORMS, 'linux/arm64')
        timeout-minutes: 4
        run: timeout 180 bash scripts/smoke-docker.sh "$IMAGE:rehearsal-arm64" linux/arm64

      - name: Remind that nothing was published
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This was a rehearsal. Run **Release** to publish." >> "$GITHUB_STEP_SUMMARY"
