name: Release

# Build once, stage by source/version/platforms, smoke BOTH target runtimes,
# promote the exact digest, then atomically push the release commit and tag.
# Re-run failed jobs to restore the same candidate, including after git push.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        type: choice
        default: auto
        options: [auto, patch, minor, major]
      version:
        description: Exact version (must advance; overrides the bump)
        required: false
        type: string
      platforms:
        description: Image architectures (AMD64-only fallback if ARM64 cannot be verified)
        type: choice
        default: linux/amd64,linux/arm64
        options: ["linux/amd64,linux/arm64", "linux/amd64"]

concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
  actions: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # A retry must use the original source, even if the release pushed.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-
      - uses: docker/setup-buildx-action@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Find a saved release candidate
        id: saved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.name == "release-candidate" and .expired == false) | .id' | head -1)"
          if [[ -n "$found" ]]; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-candidate --dir "$RUNNER_TEMP/release-candidate"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify the requested version
        if: steps.saved.outputs.found != 'true' && inputs.version != ''
        env:
          REQUESTED: ${{ inputs.version }}
        run: node scripts/check-release-version.mjs "$REQUESTED"
      - name: Create changelog and bump version
        if: steps.saved.outputs.found != 'true'
        env:
          REQUESTED: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          args=(--release --no-github --no-commit --no-tag)
          if [[ -n "$REQUESTED" ]]; then args+=(-r "$REQUESTED"); elif [[ "$BUMP" != auto ]]; then args+=("--$BUMP"); fi
          bunx --no-install changelogen "${args[@]}"
          node scripts/check-release-version.mjs "$(node -p "require('./package.json').version")" --verify-result
      - name: Stage the release commit locally
        id: release
        env:
          RESTORE: ${{ steps.saved.outputs.found }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mode=save
          if [[ "$RESTORE" == true ]]; then mode=restore; fi
          node scripts/release-candidate.mjs "$mode" "$RUNNER_TEMP/release-candidate"
      - name: Save the candidate for recovery before any image publication
        if: steps.saved.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: ${{ runner.temp }}/release-candidate/
          retention-days: 30
          if-no-files-found: error

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an interrupted release
        id: existing
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STAGED: ${{ env.IMAGE }}:${{ steps.release.outputs.stage }}
        run: node scripts/release-image-state.mjs "$IMAGE" "$VERSION" "$STAGED"
      - name: Test and compile the release candidate once
        if: steps.existing.outputs.state == 'absent'
        timeout-minutes: 15
        # test:ci builds node-server output, then tests that exact candidate.
        run: |
          started=$SECONDS
          bun run test:ci
          echo "- Native candidate compilation + release tests: $((SECONDS - started))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the tested portable Docker output
        if: steps.existing.outputs.state == 'absent'
        run: bun scripts/prepare-docker-output.mjs .output "$RUNNER_TEMP/docker-app"
      - name: Build and stage the image
        if: steps.existing.outputs.state == 'absent'
        id: build
        timeout-minutes: 15
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prebuilt
          build-contexts: app=${{ runner.temp }}/docker-app
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.stage }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=serangkai-prebuilt
          cache-to: type=gha,scope=serangkai-prebuilt,mode=max
      - name: Pin the staged manifest digest
        id: image
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"

      # Emulation is ONLY for bounded runtime verification, after all builds.
      # No native ARM runner is required for JS packaging. If runtime emulation
      # is unavailable, use the explicit AMD64-only dispatch fallback.
      - uses: docker/setup-qemu-action@v3
        timeout-minutes: 3
        if: contains(env.PLATFORMS, 'linux/arm64')
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Smoke test the staged image
        timeout-minutes: 8
        # Always re-test recovered images; a staged tag is not proof of health.
        env:
          STAGED: ${{ steps.image.outputs.reference }}
        run: timeout 360 bash scripts/smoke-docker.sh "$STAGED" "$PLATFORMS"
      - name: Promote to the version tag and latest
        if: steps.existing.outputs.state != 'promoted'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          STAGED: ${{ steps.image.outputs.reference }}
        run: docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" "$STAGED"
      - name: Push the release commit and tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
          if git merge-base --is-ancestor HEAD "origin/$BRANCH"; then
            # Retry after a successful push: never rewind subsequent commits.
            git push origin "refs/tags/$TAG"
          else
            git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$TAG"
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a GitHub release; recovery complete."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-candidate/release-notes.md"
          fi
      - name: Prune superseded staging tags
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Never delete a manifest that ALSO carries a published version tag.
          gh api --paginate "orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions" \
            --jq '.[] | select((.metadata.container.tags | length) > 0) | select(all(.metadata.container.tags[]; startswith("sha-"))) | .id' \
            | tail -n +6 | while read -r id; do
              [[ -n "$id" ]] || continue
              gh api --method DELETE "orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions/$id"
            done
      - name: Remind about package visibility
        run: |
          echo '### Image published (${{ env.PLATFORMS }})' >> "$GITHUB_STEP_SUMMARY"
          echo 'For a first release, set package visibility to public manually:' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://github.com/orgs/${{ github.repository_owner }}/packages/container/package/${{ github.event.repository.name }}/settings' >> "$GITHUB_STEP_SUMMARY"
          echo 'Until then, anonymous pulls return 401. Public packages cannot be made private again.' >> "$GITHUB_STEP_SUMMARY"
