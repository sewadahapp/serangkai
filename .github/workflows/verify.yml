name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:node
      - run: bun run test:markdown
      - run: bun run test:icons
      - run: bun run test:runtime
      - run: bun run test:deployment-config
      - run: bun run test:deployment-files
      - run: bun run test:release-readiness
      - run: bun run test:database
      - run: bun run test:ci-workflow
      - run: bun test --timeout 30000 tests/mcp-protocol.test.mjs tests/upload-api.test.mjs tests/share-api.test.mjs tests/tokens-api.test.mjs tests/folders-api.test.mjs tests/artifacts-lifecycle.test.mjs tests/security-api.test.mjs tests/bundle-api.test.mjs tests/browser-workspace.test.mjs tests/local-runtime.test.mjs
      - run: SERANGKAI_TEST_RUNTIME=node bun test tests/local-runtime.test.mjs
