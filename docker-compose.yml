version: '3.8'

services:
  serangkai:
    build: .
    ports:
      - "3000:3000"
    volumes:
      # SQLite, uploaded rangka, and versions all live here.
      - serangkai-data:/data
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME before starting}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting}
      SHARE_SECRET: ${SHARE_SECRET:?Set SHARE_SECRET before starting}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  serangkai-data:
